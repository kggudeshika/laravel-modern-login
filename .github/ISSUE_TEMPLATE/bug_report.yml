name: 🐛 Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill in as much as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /login
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message or log
      description: Paste anything from storage/logs/laravel.log or the browser console.
      render: shell
  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: "8.4"
  - type: input
    id: os
    attributes:
      label: Operating system and browser
      placeholder: Windows 11, Chrome
