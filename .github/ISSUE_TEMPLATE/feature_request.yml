name: 💡 Feature request
description: Suggest a new feature or learning example
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the feature or example.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help learners?
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Links, screenshots or examples from other projects.
